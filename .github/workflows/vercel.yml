# Publica la web (carpeta web/) en Vercel con cada subida a main.
# Proyecto: alegria-20 (dominio alegria20.es). Necesita el secreto VERCEL_TOKEN.
name: Publicar en Vercel

on:
  push:
    branches: [main]
    paths:
      - "web/**"
      - ".github/workflows/vercel.yml"
  workflow_dispatch:

concurrency:
  group: vercel-produccion
  cancel-in-progress: true

env:
  VERCEL_ORG_ID: team_KoIinFNbinDpdVKL4TgCvUK0
  VERCEL_PROJECT_ID: prj_S9ZRtPiaRgQn8BEPOLVQKR5vsK8E

jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - name: Comprobar que existe el token
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          if [ -z "$VERCEL_TOKEN" ]; then
            echo "::error::Falta el secreto VERCEL_TOKEN en Settings → Secrets and variables → Actions"
            exit 1
          fi
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Cuenta del token
        run: |
          npx --yes vercel@latest whoami --token "${{ secrets.VERCEL_TOKEN }}"
          npx --yes vercel@latest teams ls --token "${{ secrets.VERCEL_TOKEN }}"
      - name: Publicar a producción
        run: npx --yes vercel@latest deploy --prod --yes --token "${{ secrets.VERCEL_TOKEN }}"
