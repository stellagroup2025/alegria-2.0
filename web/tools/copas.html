<!doctype html>
<html lang="es"><head><meta charset="utf-8"><title>Copas</title>
<style>body{margin:0;background:#0a0610}canvas{display:block;width:100vw;height:100vh}</style>
<script type="importmap">{ "imports": { "three": "../assets/vendor/three.module.min.js" } }</script>
</head><body><canvas></canvas>
<script type="module">
// Banco de pruebas: las 5 copas de js/models.js con la misma luz que la web, sobre fondo de neón.
import * as THREE from "three";
import { RGBELoader } from "../assets/vendor/RGBELoader.js";
import { loadGlasses, buildGlass } from "../js/models.js";
const q = new URLSearchParams(location.search), only = q.get("m")?.split(",");
const canvas = document.querySelector("canvas");
const r = new THREE.WebGLRenderer({ canvas, antialias: true });
r.setPixelRatio(Math.min(devicePixelRatio, 1.5)); r.toneMapping = THREE.ACESFilmicToneMapping; r.toneMappingExposure = 1.05; r.outputColorSpace = THREE.SRGBColorSpace;
const scene = new THREE.Scene();
const bg = document.createElement("canvas"); bg.width = 512; bg.height = 512; const g = bg.getContext("2d");
const grd = g.createRadialGradient(256, 290, 0, 256, 290, 300); grd.addColorStop(0, "#c2187f"); grd.addColorStop(0.5, "#5a0f45"); grd.addColorStop(1, "#14081c");
g.fillStyle = grd; g.fillRect(0, 0, 512, 512); g.font = "bold 150px sans-serif"; g.fillStyle = "#ffd23f"; g.textAlign = "center"; g.fillText("ALEGRÍA", 256, 300);
const bt = new THREE.CanvasTexture(bg); bt.colorSpace = THREE.SRGBColorSpace;
const back = new THREE.Mesh(new THREE.PlaneGeometry(9, 6), new THREE.MeshBasicMaterial({ map: bt, toneMapped: false })); back.position.z = -2.4; scene.add(back);
const cam = new THREE.PerspectiveCamera(30, 1, 0.1, 50); cam.position.set(0, 0.25, 3.6); cam.lookAt(0, 0, 0);
const pm = new THREE.PMREMGenerator(r);
const env = (f) => new RGBELoader().loadAsync(f).then((h) => { h.mapping = THREE.EquirectangularReflectionMapping; return pm.fromEquirectangular(h).texture; });
const key = new THREE.DirectionalLight(0xfff4ea, 2.4); key.position.set(1.8, 3.2, 3);
const fill = new THREE.DirectionalLight(0xc9d8ff, 0.6); fill.position.set(-3, 0.5, 2.5);
const rimL = new THREE.SpotLight(0xff2fb3, 40, 12, 0.6, 0.8); rimL.position.set(-3.2, 1.2, -1.8);
const rimR = new THREE.SpotLight(0x19e6ff, 40, 12, 0.6, 0.8); rimR.position.set(3.2, -0.2, -1.8);
scene.add(key, fill, rimL, rimR, new THREE.HemisphereLight(0xffffff, 0x1a0d24, 0.35));
const types = only || ["highball", "balon", "martini", "margarita", "coupe"], holders = [];
const [studio, neon] = await Promise.all([env("../assets/hdr/studio_small_09_1k.hdr"), env("../assets/hdr/neon_photostudio_1k.hdr"), loadGlasses("../")]);
scene.environment = studio;
types.forEach((t, i) => {
  const m = buildGlass(t); m.traverse((o) => { if (o.material?.userData?.isLiquid) o.material.envMap = neon; });
  const h = new THREE.Group(); h.add(m); h.scale.setScalar(types.length > 2 ? 0.58 : 1.2);
  h.position.x = (i - (types.length - 1) / 2) * (types.length > 2 ? 0.56 : 1.3); scene.add(h); holders.push(h);
});
function size() { const w = innerWidth, h = innerHeight; r.setSize(w, h, false); cam.aspect = w / h; cam.updateProjectionMatrix(); }
size(); addEventListener("resize", size);
window.rotY = q.has("spin") ? null : 0.4;
r.setAnimationLoop((t) => { holders.forEach((h) => (h.rotation.y = window.rotY ?? t / 1600)); r.render(scene, cam); });
window.__ready = true;
</script></body></html>
